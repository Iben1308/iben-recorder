plugins { id 'com.android.application' }

android {
    namespace 'ua.iben.recorder'
    compileSdk 35
    defaultConfig {
        applicationId 'ua.iben.recorder.oreo'
        minSdk 27
        targetSdk 27
        versionCode 3
        versionName '0.4-oreo.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release { minifyEnabled false }
    }
    lint {
        // This is the explicitly API-27, sideloaded prototype, not a Play Store release.
        // Keep the store-target notice visible without hiding any runtime/API errors.
        warning 'ExpiredTargetSdkVersion'
    }
}

// No Play Services, Firebase, ads, analytics or third-party runtime dependencies.
