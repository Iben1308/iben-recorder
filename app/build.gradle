plugins { id 'com.android.application' }

android {
    namespace 'ua.iben.recorder'
    compileSdk 35
    defaultConfig {
        applicationId 'ua.iben.recorder.oreo'
        minSdk 27
        targetSdk 35
        versionCode 8
        versionName '0.7.1'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release { minifyEnabled false }
    }
}

// No Play Services, Firebase, ads, analytics or third-party runtime dependencies.
