plugins { id 'com.android.application' }

def ksFile = rootProject.file('keystore.properties')
def ksProps = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ksProps.load(it) }

android {
    namespace 'ua.iben.recorder'
    compileSdk 35
    defaultConfig {
        applicationId 'ua.iben.recorder.oreo'
        minSdk 27
        targetSdk 35
        versionCode 11
        versionName '0.7.4'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias ksProps['keyAlias']
                keyPassword ksProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (ksFile.exists()) signingConfig signingConfigs.release
        }
    }
}

// No Play Services, Firebase, ads, analytics or third-party runtime dependencies.
