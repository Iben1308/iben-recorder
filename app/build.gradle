plugins { id 'com.android.application' }

android {
    namespace 'ua.iben.recorder'
    compileSdk 35
    defaultConfig {
        applicationId 'ua.iben.recorder'
        minSdk 29
        targetSdk 29
        versionCode 2
        versionName '0.2.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    buildTypes {
        release { minifyEnabled false }
    }
}

// No Play Services, Firebase, ads, analytics or third-party runtime dependencies.
